apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: demo1
  namespace: voter
spec:
  branch: main
  clusterProviderRef:
    name: default
  commit:
    message:
      liveTemplate: |-
        chore(demo1): {{.Count}} change{{if ne .Count 1}}s{{end}}

        {{range .Resources -}}
        - [{{.Operation}}] {{.Resource}}/{{.Name}}
        {{end -}}
      reconcileTemplate: 'chore(demo1): reconcile {{.Count}} {{if .Resource}}{{.Resource}}{{else}}resources{{end}}'
    window: 5s
  gitProviderRef:
    name: k8s-audit-trail
  path: clusters/k8s.koudijs.dev/demo1
  placement:
    byType:
      examples.configbutler.ai/v1alpha1/quizsessions: quiz-configs.yaml
      examples.configbutler.ai/v1alpha1/quizsubmissions: submissions.yaml
      v1/secrets: secrets/{namespace}/{name}{sensitiveSuffix}
      rbac.authorization.k8s.io/v1/rolebindings: authorization.yaml
      rbac.authorization.k8s.io/v1/roles: authorization.yaml
    default: '{name}.yaml'
  prune:
    mode: Always
  serializeNamespace: false
  onRefusal: Ignore
