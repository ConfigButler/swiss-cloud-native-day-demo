apiVersion: platform.configbutler.ai/v1alpha1
kind: Database
metadata:
  annotations:
    platform.configbutler.ai/intent: Throwaway instance for the fraud model bake-off. We expect to delete this in six weeks and we would rather say so up front than leave you guessing in eighteen months.
  name: fraud-features-postgresql
spec:
  dataClassification: internal
  deletionPolicy: delete
  engine: postgresql
  engineVersion: "16"
  network:
    exposure: cluster-only
  owner:
    contact: data-analytics@example.com
    costCentre: CC-finance-12
    team: data-analytics
  purpose: Feature store for the fraud model bake-off. Synthetic and anonymised data only -- no production cardholder data, by agreement with Risk.
  region: eu-central-2
  service: fraud-scoring
  size: large
  storageGB: 2000
  tier: sandbox
