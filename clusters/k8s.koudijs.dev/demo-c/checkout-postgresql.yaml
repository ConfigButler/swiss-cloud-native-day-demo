apiVersion: platform.configbutler.ai/v1alpha1
kind: Database
metadata:
  annotations:
    platform.configbutler.ai/intent: Checkout is outgrowing the shared cluster and needs its own store before the Black Friday freeze. We have been on the shared instance for two years and the noisy-neighbour incidents are now monthly.
  name: checkout-postgresql
spec:
  backup:
    pointInTimeRecovery: true
    retentionDays: 35
  dataClassification: confidential
  deletionPolicy: retain
  engine: postgresql
  engineVersion: "16"
  maintenanceWindow: Sun:02:00-04:00
  network:
    exposure: cluster-only
  owner:
    contact: payments-core@example.com
    costCentre: CC-finance-07
    onCallRotation: PD-SCHED-1234
    team: payments-core
  purpose: Orders, payments and the idempotency ledger for the checkout flow. If this is down, the shop cannot take money.
  region: eu-central-2
  service: checkout
  size: medium
  tier: business-critical
